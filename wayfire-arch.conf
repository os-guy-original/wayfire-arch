# Add near the TOP of /etc/pacman.conf, right after [options] and ABOVE
# [system]/[world]/[galaxy]/[extra]/[chaotic-aur]. pacman.conf(5): the first
# repo listed wins for the same package name regardless of version, so
# wayfire-arch must come before any repo that ships its own wayfire, otherwise
# pacman picks theirs. Import and locally sign the key first (see README.md).
[wayfire-arch]
Server = https://os-guy-original.github.io/wayfire-arch/$arch
SigLevel = Required
